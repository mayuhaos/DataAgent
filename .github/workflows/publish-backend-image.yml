name: 发布后端镜像

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: data-agent-backend

jobs:
  publish:
    environment: aliyun-acr
    runs-on: ubuntu-22.04
    steps:
      - name: 校验 ACR 配置
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY || secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE || secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          test -n "$ACR_REGISTRY" || { echo 'Missing repository variable ACR_REGISTRY'; exit 1; }
          test -n "$ACR_NAMESPACE" || { echo 'Missing repository variable ACR_NAMESPACE'; exit 1; }
          test -n "$ACR_USERNAME" || { echo 'Missing repository secret ACR_USERNAME'; exit 1; }
          test -n "$ACR_PASSWORD" || { echo 'Missing repository secret ACR_PASSWORD'; exit 1; }

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 打包后端 JAR
        run: ./mvnw --batch-mode --no-transfer-progress -pl data-agent-management -am package -DskipTests

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云容器镜像服务
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY || secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-file/Dockerfile-backend
          push: true
          platforms: ${{ vars.DOCKER_PLATFORMS || secrets.DOCKER_PLATFORMS || 'linux/amd64' }}
          provenance: false
          sbom: false
          tags: |
            ${{ vars.ACR_REGISTRY || secrets.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE || secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            ${{ vars.ACR_REGISTRY || secrets.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE || secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
