name: Publish Backend Image

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: data-agent-backend

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Validate ACR configuration
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          test -n "$ACR_REGISTRY" || { echo 'Missing repository variable ACR_REGISTRY'; exit 1; }
          test -n "$ACR_NAMESPACE" || { echo 'Missing repository variable ACR_NAMESPACE'; exit 1; }
          test -n "$ACR_USERNAME" || { echo 'Missing repository secret ACR_USERNAME'; exit 1; }
          test -n "$ACR_PASSWORD" || { echo 'Missing repository secret ACR_PASSWORD'; exit 1; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend JAR
        run: ./mvnw --batch-mode --no-transfer-progress -pl data-agent-management -am package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud Container Registry
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-file/Dockerfile-backend
          push: true
          platforms: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64' }}
          tags: |
            ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
