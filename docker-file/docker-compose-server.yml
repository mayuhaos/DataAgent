# 服务器部署专用：只拉取镜像，不在服务器执行 Maven 或 Docker build。
services:
  data-agent-backend:
    image: ${DATA_AGENT_BACKEND_IMAGE:?Set DATA_AGENT_BACKEND_IMAGE to the ACR image reference}
    container_name: data-agent-backend
    restart: unless-stopped
    ports:
      - "8065:8065"
    volumes:
      - /home/data/app/nl2sql-agent/application.yml:/app/config/application.yml:ro
    environment:
      # 也可以将密钥全部放在 application.yml 中；这里仅保留可选覆盖项。
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY:-}
